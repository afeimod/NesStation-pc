            ls -la "${QT_CMAKE_DIR}/" | head -20
            exit 0
          fi
          echo "（官方配置缺失，安装仓库自带 shim 兜底）"
          mkdir -p "${QT_CMAKE_DIR}"
          cp -v scripts/qt6-opengl-shim/Qt6OpenGLConfig.cmake \
                scripts/qt6-opengl-shim/Qt6OpenGLConfigVersion.cmake \
                "${QT_CMAKE_DIR}/"
          ls -la "${QT_CMAKE_DIR}/"

      - name: ccache 加速重建（dolphin）
        if: matrix.emu == 'dolphin'
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ccache-dolphin-linux-arm64-${{ github.sha }}
          restore-keys: ccache-dolphin-linux-arm64-

      - name: Build emulator
        env:
          CCACHE_DIR: /root/.cache/ccache
          EDEN_FORCE_SYSTEM: "OFF"
        run: |
          set -o pipefail
          bash scripts/build_emulators.sh ${{ matrix.emu }} 3 2>&1 | tee build_${{ matrix.emu }}.log

      - name: Write status
        if: always()
        run: |
          mkdir -p dist
          OUT="dist/emulators/${{ matrix.emu }}"
          BIN_OK=0
          case "${{ matrix.emu }}" in
            dolphin) [ -n "$(find "$OUT" -type f \( -name 'Dolphin.exe' -o -name 'dolphin-emu' \) 2>/dev/null)" ] && BIN_OK=1 ;;
            eden)    [ -n "$(find "$OUT" -type f \( -name 'eden.exe'  -o -name 'eden' \) 2>/dev/null)" ] && BIN_OK=1 ;;
          esac
          if [ "$BIN_OK" = "1" ]; then
            echo "ok" > dist/_status.txt
            echo "构建成功" >> dist/_status.txt
          else
            echo "failed: 产物二进制未生成" > dist/_status.txt
          fi
          cat dist/_status.txt
          tail -n 400 "build_${{ matrix.emu }}.log" > dist/_build_tail.log 2>/dev/null || true
          find dist -maxdepth 3 -type d || true

      - name: Trim dist (only this emulator)
        if: always()
        run: |
          if [ -d "dist/emulators" ]; then
            find dist/emulators -mindepth 1 -maxdepth 1 -type d \
              ! -name '${{ matrix.emu }}' -exec rm -rf {} + 2>/dev/null || true
          fi
          ls -la dist dist/emulators 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-linux-arm64-${{ matrix.emu }}
          path: dist/

  emu-windows-x64:
    name: "EMU ${{ matrix.emu }} · windows-x64"
    if: ${{ github.event.inputs.with_emulators != 'false' &&
            (github.event.inputs.target == 'all' ||
             github.event.inputs.target == 'emulators' ||
             github.event.inputs.target == 'windows-x64') }}
    runs-on: windows-2022
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        emu: [dolphin, cemu, eden]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 (Dolphin/Eden)
        # ★v1.2.3：Qt 6.8 起基础包已内置 qtsvg + qttools（windeployqt/Linguist
        #   都在），再显式请求这两个"模块"会报
        #   "The packages ['qtsvg','qttools'] were not found while parsing XML"
        #   （aqt 元数据里它们已不是可选模块）。仅保留真正以模块形式存在的
        #   qtcharts（Eden 必需）；Dolphin 需要的 Svg 在基础包里。
        #   依据：qt-repo-cache（aqt list-qt 实测镜像）6.8.3/win64_msvc2022_64
        #   的 34 个可选模块中不含 qtsvg/qttools。
        # ★v1.2.5：install-qt-action 的 dir 是【前缀】，源码
        #   path.resolve(dir, "Qt") 会再拼一层 Qt —— dir 填 'C:/Qt' 时实际
        #   装到 C:/Qt/Qt/6.8.3/msvc2022_64，旧步骤硬编码
        #   C:/Qt/6.8.3/... 的 ls 自检必挂（run 41994953377 中 dolphin/eden
        #   windows 两 job 2~3 分钟即死、构建日志为空的直接原因）。
        #   dir 改为 'C:/' 使实际布局回归 C:/Qt/6.8.3/msvc2022_64；
        #   构建步骤改用 action 导出的 QT_ROOT_DIR（见下方 Build 步骤）。
        if: ${{ matrix.emu != 'cemu' }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'
          dir: 'C:/'
          cache: 'false'

      - name: Install pkgconfiglite (cemu)
        # ★v1.2.3：vcpkg 快照里 msys2 的 pkgconf 1~2.2.0-1 已被上游镜像删除
        #   （全部镜像 404），openssl 构建尾部 vcpkg_fixup_pkgconfig 必挂。
        #   vcpkg_find_acquire_program(PKGCONFIG) 优先读 PKG_CONFIG 环境变量
        #   —— 预装 pkgconfiglite 并指向它，完全绕开 msys 下载。
        if: ${{ matrix.emu == 'cemu' }}
        shell: pwsh
        run: choco install -y --no-progress pkgconfiglite

      - name: Install glslangValidator (Eden)
        # ★v1.2.7：glslang 官方发布件从 14.x 起把 glslangValidator 更名为
        #   glslang —— 16.6.0 的 zip 里只有 bin/glslang.exe（已实测核实），
        #   旧步骤只找 glslangValidator.exe 必抛 "not found in archive"
        #   （本次 EMU eden · windows-x64 的死因）。
        #   修复：两个名字都找；找到 glslang.exe 时复制一份旧名
        #   glslangValidator.exe —— Eden 的 host_shaders/CMakeLists.txt
        #   find_program(GLSLANGVALIDATOR "glslangValidator")（本次已同步
        #   改为 NAMES glslangValidator glslang 双名兼容），复制旧名保证
        #   两个版本都能命中。
        if: ${{ matrix.emu == 'eden' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dst = "D:/a/glslang"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $zip = "$env:TEMP/glslang.zip"
          Invoke-WebRequest -Uri "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          # 新版发布件叫 glslang.exe，旧版叫 glslangValidator.exe —— 都接受
          $bin = Get-ChildItem -Path $dst -Recurse -Filter glslangValidator.exe | Select-Object -First 1
          if (-not $bin) {
            $bin = Get-ChildItem -Path $dst -Recurse -Filter glslang.exe | Select-Object -First 1
          }
          if (-not $bin) { throw "archive 中既无 glslang.exe 也无 glslangValidator.exe" }
          Write-Output "glslang: $($bin.FullName)"
          & $bin.FullName --version
          $bindir = Split-Path -Parent $bin.FullName
          # 复制一份旧名（find_program 兼容；同目录同内容，无副作用）
          if ($bin.Name -ne "glslangValidator.exe") {
            Copy-Item $bin.FullName (Join-Path $bindir "glslangValidator.exe") -Force
            Write-Output "已复制为 glslangValidator.exe（find_program 兼容名）"
          }
          Add-Content $env:GITHUB_PATH $bindir

      - name: vcpkg binary cache (cemu)
        if: ${{ matrix.emu == 'cemu' }}
        uses: actions/cache@v4
        with:
          path: vcpkg-binary
          key: vcpkg-bin-cemu-win-x64-${{ hashFiles('emulators/cemu/vcpkg.json') }}

      - name: Build emulator
        # shell:bash = Windows runner 自带 Git Bash；构建脚本全平台统一
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary
          EDEN_FORCE_SYSTEM: "OFF"
          # ★v1.2.3：vcpkg 优先使用此路径的 pkg-config，跳过 msys 下载
          PKG_CONFIG: 'C:\ProgramData\chocolatey\bin\pkg-config.exe'
        run: |
          set -o pipefail
          set -eux
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          # ★v1.2.5：Qt 目录不再硬编码 —— install-qt-action 向后续步骤导出
          #   QT_ROOT_DIR（指到含 bin/qmake.exe 的真实安装根），优先使用；
          #   历史路径作缺失时的兜底候选；全部没有则列出 C:/Qt 下的实际布局
          #   后明确报错退出（不再“空日志猝死”，日志可直查）。
          if [ "${{ matrix.emu }}" != "cemu" ]; then
            QT_ROOT="${QT_ROOT_DIR:-}"
            if [ -z "$QT_ROOT" ] || [ ! -f "$QT_ROOT/bin/qmake.exe" ]; then
              QT_ROOT=""
              for d in "C:/Qt/6.8.3/msvc2022_64" \
                       "C:/Qt/Qt/6.8.3/msvc2022_64" \
                       "C:/Qt/6.8.3/win64_msvc2022_64"; do
                [ -f "$d/bin/qmake.exe" ] && QT_ROOT="$d" && break
              done || true
            fi
            if [ -z "$QT_ROOT" ]; then
              echo "::error::未找到 Qt 6.8.3（QT_ROOT_DIR='${QT_ROOT_DIR:-}'）；C:/Qt 实际布局："
              find C:/Qt -maxdepth 4 -name qmake.exe 2>/dev/null || true
              exit 1
            fi
            echo "（Qt 目录：$QT_ROOT）"
            export CMAKE_PREFIX_PATH="$QT_ROOT"
            export QT_DIR="$QT_ROOT/lib/cmake/Qt6"
          else
            # pkgconfiglite 自检（缺失则 vcpkg 会回落到死链 msys 源）
            ls "C:/ProgramData/chocolatey/bin/pkg-config.exe" >/dev/null
            "C:/ProgramData/chocolatey/bin/pkg-config.exe" --version
          fi
          bash scripts/build_emulators.sh ${{ matrix.emu }} 3 2>&1 | tee build_${{ matrix.emu }}.log

      - name: Write status
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          OUT="dist/emulators/${{ matrix.emu }}"
          BIN_OK=0
          case "${{ matrix.emu }}" in
            dolphin) [ -n "$(find "$OUT" -type f \( -name 'Dolphin.exe' -o -name 'dolphin-emu' \) 2>/dev/null)" ] && BIN_OK=1 ;;
            cemu)    [ -n "$(find "$OUT" -type f \( -name 'Cemu.exe'  -o -name 'Cemu' \) 2>/dev/null)" ] && BIN_OK=1 ;;
            eden)    [ -n "$(find "$OUT" -type f \( -name 'eden.exe'  -o -name 'eden' \) 2>/dev/null)" ] && BIN_OK=1 ;;
          esac
          if [ "$BIN_OK" = "1" ]; then
            echo "ok" > dist/_status.txt
            echo "构建成功" >> dist/_status.txt
          else
            echo "failed: 产物二进制未生成" > dist/_status.txt
          fi
          cat dist/_status.txt
          tail -n 400 "build_${{ matrix.emu }}.log" > dist/_build_tail.log 2>/dev/null || true
          find dist -maxdepth 3 -type d || true

      - name: Trim dist (only this emulator)
        if: always()
        shell: bash
        run: |
          if [ -d "dist/emulators" ]; then
            find dist/emulators -mindepth 1 -maxdepth 1 -type d \
              ! -name '${{ matrix.emu }}' -exec rm -rf {} + 2>/dev/null || true
          fi
          ls -la dist dist/emulators 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-windows-x64-${{ matrix.emu }}
          path: dist/

  # ==========================================================================
  # 打包合并：前端本体 + 三大模拟器 → 最终发行包
  #   linux-x64   → NesStation-linux-x64-full.tar.gz
  #   linux-arm64 → nesstation_<版本>_arm64_full.deb（注入 /opt/nesstation/emulators）
  #   windows-x64 → NesStation-windows-x64-full.zip
  # 某模拟器状态为 failed / 缺失时自动跳过该模拟器，其余照常打包；
  # needs 里 emu-* 为 skipped（with_emulators=false）时本作业一并跳过。
  # ==========================================================================
  bundle-linux-x64:
    name: Bundle Linux x64 (+emulators)
    needs: [linux-x64, emu-dolphin-eden-linux-x64, emu-cemu-linux-x64]
    if: ${{ !cancelled() &&
            needs.linux-x64.result == 'success' &&
            needs.emu-dolphin-eden-linux-x64.result != 'skipped' &&
            needs.emu-cemu-linux-x64.result != 'skipped' &&
            (github.event.inputs.target == 'all' || github.event.inputs.target == 'linux-x64') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: NesStation-linux-x64, path: app }

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: emu-linux-x64-dolphin, path: emu/dolphin }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: emu-linux-x64-cemu, path: emu/cemu }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: emu-linux-x64-eden, path: emu/eden }

      - name: Assemble
        run: |
          set -eux
          cd app && tar xzf NesStation-linux-x64.tar.gz && cd ..
          ok() { [ -f "emu/$1/_status.txt" ] && grep -q '^ok' "emu/$1/_status.txt"; }
          INCLUDED=""
          for e in dolphin cemu eden; do
            # ★v1.2.5：状态 ok 但产物目录缺失（artifact 中转丢件）时降级为
            #   警告并跳过，不让单个模拟器击溃整个发行包
            if ok $e && [ -d "emu/$e/emulators/$e" ]; then
              mkdir -p app/NesStation-linux/emulators
              cp -r "emu/$e/emulators/$e" "app/NesStation-linux/emulators/$e"
              INCLUDED="$INCLUDED $e"
            elif ok $e; then
              echo "::warning::linux-x64 模拟器 $e 状态 ok 但产物目录缺失（artifact 中转异常），发行包跳过"
            else
              echo "::warning::linux-x64 模拟器 $e 未成功构建，发行包跳过"
              [ -f "emu/$e/_build_tail.log" ] && tail -n 20 "emu/$e/_build_tail.log" || true
            fi
          done
          # artifact 中转会丢失可执行位：恢复模拟器可执行文件权限
          find app/NesStation-linux/emulators -type f \
            \( -name 'dolphin-emu' -o -name 'dolphin-tool' -o -name 'Cemu' -o -name 'eden' \) \
            -exec chmod 0755 {} + 2>/dev/null || true
          echo "included emulators:$INCLUDED" | tee app/NesStation-linux/模拟器清单.txt
          [ -n "$INCLUDED" ] || { echo "::error::没有任何模拟器构建成功"; exit 1; }
          cd app && tar czf ../NesStation-linux-x64-full.tar.gz NesStation-linux

      - uses: actions/upload-artifact@v4
        with:
          name: NesStation-linux-x64-full
          path: NesStation-linux-x64-full.tar.gz

  bundle-linux-arm64:
    name: Bundle Linux arm64 deb (+emulators)
    needs: [linux-arm64, emu-dolphin-eden-linux-arm64]
    if: ${{ !cancelled() &&
            needs.linux-arm64.result == 'success' &&
            needs.emu-dolphin-eden-linux-arm64.result != 'skipped' &&
            (github.event.inputs.target == 'all' || github.event.inputs.target == 'linux-arm64') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: NesStation-linux-arm64-deb, path: appdeb }

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: emu-linux-arm64-dolphin, path: emu/dolphin }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: emu-linux-arm64-eden, path: emu/eden }

      - name: Assemble deb
        run: |
          set -eux
          DEB=$(ls appdeb/*.deb | head -1)
          rm -rf ex && mkdir ex
          dpkg-deb -x "$DEB" ex
          dpkg-deb -e "$DEB" ex/DEBIAN
          ok() { [ -f "emu/$1/_status.txt" ] && grep -q '^ok' "emu/$1/_status.txt"; }
          INCLUDED=""
          for e in dolphin eden; do
            # ★v1.2.5：同 linux-x64 —— 状态 ok 但产物目录缺失时降级警告
            if ok $e && [ -d "emu/$e/emulators/$e" ]; then
              mkdir -p ex/opt/nesstation/emulators
              cp -r "emu/$e/emulators/$e" "ex/opt/nesstation/emulators/$e"
              INCLUDED="$INCLUDED $e"
            elif ok $e; then
              echo "::warning::linux-arm64 模拟器 $e 状态 ok 但产物目录缺失（artifact 中转异常），发行包跳过"
            else
              echo "::warning::linux-arm64 模拟器 $e 未成功构建，发行包跳过"
              [ -f "emu/$e/_build_tail.log" ] && tail -n 20 "emu/$e/_build_tail.log" || true
            fi
          done
          # Cemu 上游仅 x86_64：ARM64 设备提示经 box64 运行 x64 包
          echo "included emulators:$INCLUDED" > ex/opt/nesstation/模拟器清单.txt
          cat >> ex/opt/nesstation/模拟器清单.txt <<'EOF'
          Cemu（Wii U）上游仅提供 x86_64 构建，ARM64 系统未内置；
          如需运行请用 box64 执行 x86_64 版 Cemu（设置 → 核心设置 → 外置核心 → 手动选择）。
          EOF
          # 运行库提示（可选安装）
          cat > ex/opt/nesstation/模拟器依赖.txt <<'EOF'
          内置模拟器为系统库动态链接，缺失时按需安装（Debian 12 示例；
          Ubuntu 24.04+ 的 libasound2 改名为 libasound2t64）：
            Dolphin: sudo apt install libqt6widgets6 libqt6gui6 libqt6core6 libqt6dbus6 libqt6svg6 libqt6charts6 libpulse0 libasound2
            Eden:    sudo apt install libboost-locale1.74+ libfmt9 liblz4-1 libopus0 libzstd1 zlib1g libvulkan1
          EOF
          # 重算 md5sums + 权限
          cd ex && find . -type f ! -path "./DEBIAN/*" -exec md5sum {} \; \
            | sed 's|  \./|  |' > DEBIAN/md5sums && cd ..
          find ex -type d -exec chmod 0755 {} \;
          find ex -type f -exec chmod 0644 {} \;
          chmod 0755 ex/opt/nesstation/nesstation
          # 恢复模拟器可执行位（上面统一 chmod 0644 会清掉）
          find ex/opt/nesstation/emulators -type f \
            \( -name 'dolphin-emu' -o -name 'dolphin-tool' -o -name 'eden' \) \
            -exec chmod 0755 {} + 2>/dev/null || true
          # 重新版本号（+emu 后缀区分）
          NEWVER=$(grep -m1 '^Version:' ex/DEBIAN/control | awk '{print $2}')+emu
          sed -i "s/^Version:.*/Version: $NEWVER/" ex/DEBIAN/control
          if [ -z "$INCLUDED" ]; then
            echo "::error::arm64 没有任何模拟器构建成功"
            exit 1
          fi
          dpkg-deb --build --root-owner-group ex "nesstation_${NEWVER}_arm64.deb"
          dpkg-deb --info "nesstation_${NEWVER}_arm64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: NesStation-linux-arm64-deb-full
          path: nesstation_*_arm64.deb

  bundle-windows-x64:
    name: Bundle Windows x64 (+emulators)
    needs: [windows-x64, emu-windows-x64]
    if: ${{ !cancelled() &&
            needs.windows-x64.result == 'success' &&
            needs.emu-windows-x64.result != 'skipped' &&
            (github.event.inputs.target == 'all' || github.event.inputs.target == 'windows-x64') }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: NesStation-windows-x64, path: app }

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: emu-windows-x64-dolphin, path: emu/dolphin }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: emu-windows-x64-cemu, path: emu/cemu }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: emu-windows-x64-eden, path: emu/eden }

      - name: Assemble
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -Path app/NesStation-windows-x64.zip -DestinationPath app
          $out = "app/NesStation-windows"
          $included = @()
          foreach ($e in @("dolphin","cemu","eden")) {
            $status = "emu/$e/_status.txt"
            $payload = "emu/$e/emulators/$e"
            # ★v1.2.5：状态 ok 但产物目录缺失（artifact 中转丢件）时降级为
            #   警告并跳过，不让单个模拟器击溃整个发行包
            if ((Test-Path $status) -and ((Get-Content $status -First 1) -eq "ok") -and (Test-Path $payload)) {
              New-Item -ItemType Directory -Force -Path "$out/emulators" | Out-Null
              Copy-Item -Path $payload -Destination "$out/emulators/$e" -Recurse -Force
              $included += $e
            } elseif ((Test-Path $status) -and ((Get-Content $status -First 1) -eq "ok")) {
              Write-Output "::warning::windows-x64 模拟器 $e 状态 ok 但产物目录缺失（artifact 中转异常），发行包跳过"
            } else {
              Write-Output "::warning::windows-x64 模拟器 $e 未成功构建，发行包跳过"
              if (Test-Path "emu/$e/_build_tail.log") { Get-Content "emu/$e/_build_tail.log" -Tail 20 }
            }
          }
          if ($included.Count -eq 0) { throw "没有任何模拟器构建成功" }
          "included emulators: $($included -join ', ')" | Out-File "$out/模拟器清单.txt" -Encoding utf8
          Compress-Archive -Path $out -DestinationPath NesStation-windows-x64-full.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NesStation-windows-x64-full
          path: NesStation-windows-x64-full.zip
