          mkdir -p dist
          OUT="dist/emulators/cemu"
          BIN_OK=0
          [ -n "$(find "$OUT" -type f \( -name 'Cemu.exe' -o -name 'Cemu' \) 2>/dev/null)" ] && BIN_OK=1
          if [ "$BIN_OK" = "1" ]; then
            echo "ok" > dist/_status.txt
            echo "构建成功" >> dist/_status.txt
          else
            echo "failed: 产物二进制未生成" > dist/_status.txt
          fi
          cat dist/_status.txt
          tail -n 400 build_cemu.log > dist/_build_tail.log 2>/dev/null || true
          find dist -maxdepth 3 -type d || true

      - name: Trim dist (only cemu)
        if: always()
        run: |
          if [ -d "dist/emulators" ]; then
            find dist/emulators -mindepth 1 -maxdepth 1 -type d \
              ! -name 'cemu' -exec rm -rf {} + 2>/dev/null || true
          fi
          ls -la dist dist/emulators 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-linux-x64-cemu
          path: dist/

  emu-dolphin-eden-linux-arm64:
    name: "EMU ${{ matrix.emu }} · linux-arm64"
    if: ${{ github.event.inputs.with_emulators != 'false' &&
            (github.event.inputs.target == 'all' ||
