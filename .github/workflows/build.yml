          # 与 linux-x64 相同清单（debian:12 双架构通用；qt6-charts-dev 有 arm64）
          # ★v1.2.5：+libsdl2-dev（Eden 的 externals 无条件 find_package(SDL2 2.26.4)；
          #   Debian 12 提供 2.26.5 满足版本下限）
          # ★v1.2.6：+qt6-base-private-dev（Dolphin qpa 私有头）+
          #   glslang-tools（Eden 构建期着色器编译器）—— 同 linux-x64
          # ★v1.2.7：+libqt6opengl6-dev —— 官方 Qt6OpenGL CMake 配置
          #   （arm64 同样提供；详见 linux-x64 同名步骤说明）
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            unzip python3 nasm yasm ccache patchelf \
            libegl1-mesa-dev libevdev-dev libudev-dev libx11-dev libxi-dev \
            libxrandr-dev libpulse-dev libasound2-dev libbluetooth-dev \
            libcurl4-openssl-dev libvulkan-dev libsdl2-dev \
            qt6-base-dev qt6-tools-dev qt6-svg-dev qt6-charts-dev \
            qt6-base-private-dev glslang-tools libqt6opengl6-dev \
            libboost-all-dev libfmt-dev liblz4-dev nlohmann-json3-dev \
            zlib1g-dev libzstd-dev libopus-dev libssl-dev libgl1-mesa-dev \
            libglvnd-dev libusb-1.0-0-dev \
            libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libavformat-dev libavfilter-dev

      - name: Qt6OpenGL shim（Eden · 官方配置缺失时的兜底）
        # ★v1.2.7：同 linux-x64 —— 官方配置优先，shim 兜底
        if: matrix.emu == 'eden'
        run: |
          set -eux
