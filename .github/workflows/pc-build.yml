name: PC Build

# NesStation for PC —— 电脑版三平台构建（替代原 Android 构建）
# 触发：推送到 main / 手动 / 打 tag 发布 Release
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build distributable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./gradlew packageMsi packageExe --no-daemon
          mkdir -p dist
          cp build/compose/binaries/main/msi/*.msi dist/ || true
          cp build/compose/binaries/main/exe/*.exe dist/ || true

      - name: Build distributable (Linux)
        if: runner.os == 'Linux'
        run: |
          ./gradlew packageDeb packageRpm --no-daemon
          mkdir -p dist
          cp build/compose/binaries/main/deb/*.deb dist/ || true
          cp build/compose/binaries/main/rpm/*.rpm dist/ || true

      - name: Build distributable (macOS)
        if: runner.os == 'macOS'
        run: |
          ./gradlew packageDmg --no-daemon
          mkdir -p dist
          cp build/compose/binaries/main/dmg/*.dmg dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NesStation-PC-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    # 打 tag（v*）时发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
